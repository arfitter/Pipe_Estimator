<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0A0A0A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PipeEstimator" />
<meta name="application-name" content="PipeEstimator" />
<title>Tingle Pipe Estimator — Offline</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="%230A0A0A"/><circle cx="32" cy="32" r="18" stroke="%2300E5FF" stroke-width="4" fill="none"/><circle cx="32" cy="32" r="8" fill="%2300E5FF"/></svg>' />
<style>
/* ===================================================================== */
/*  PIPE ESTIMATOR — Single-file offline app (PC EXE + Android APK ready) */
/*  Design language: Industrial Control-Room, dark obsidian + neon accent */
/* ===================================================================== */
:root{
  --bg:#0A0A0A;
  --surface:#121212;
  --surface-elev:#1C1C1E;
  --border:#2C2C2E;
  --border-strong:#3A3A3C;
  --text:#FFFFFF;
  --text-2:#C7C7CC;
  --muted:#8E8E93;
  --dim:#636366;
  --neon:#00E5FF;
  --neon-soft:rgba(0,229,255,.12);
  --blue:#0A84FF;
  --green:#32D74B;
  --red:#FF453A;
  --orange:#FF9F0A;
  --yellow:#FFD60A;
  --purple:#BF5AF2;
  --magenta:#FF2D92;
  --header-h:64px;
  --dash-h:46px;
  --nav-h:54px;
  --tap:44px;
  --r:6px;
  --mono:'JetBrains Mono','SF Mono','Cascadia Code','Consolas','Roboto Mono',ui-monospace,monospace;
  --ui:'Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14px;line-height:1.4;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}

/* embedded fonts via system-stack only — guarantees 100% offline operation */

/* ----- Layout shell ----- */
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
header.topbar{position:sticky;top:0;z-index:90;background:linear-gradient(180deg,#101010,#0A0A0A);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:10px;min-height:var(--header-h)}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo .ring{width:30px;height:30px;border-radius:50%;border:3px solid var(--neon);position:relative;flex-shrink:0}
.logo .ring::after{content:'';position:absolute;inset:5px;background:var(--neon);border-radius:50%}
.brand{font-weight:900;letter-spacing:-.5px;font-size:16px;line-height:1}
.brand small{display:block;font-weight:600;font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-top:2px}
.topbar-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ----- Live dashboard ----- */
.live{display:flex;gap:8px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 12px;min-height:var(--dash-h);scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.live::-webkit-scrollbar{height:4px}
.live::-webkit-scrollbar-thumb{background:var(--border-strong)}
.kpi{flex-shrink:0;display:flex;flex-direction:column;justify-content:center;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:5px 10px;min-width:120px}
.kpi .lbl{font-size:9px;font-weight:800;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.kpi .val{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:-.5px;margin-top:1px}
.kpi.quote .val{color:var(--green)}
.kpi.mh .val{color:var(--red)}
.kpi.di .val{color:var(--purple)}
.kpi.cpm .val{color:var(--neon)}
.kpi.sched .val{color:var(--yellow)}
.kpi.peak .val{color:var(--orange)}

/* ----- Tab nav ----- */
nav.tabs{display:flex;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--border);scrollbar-width:none;position:sticky;top:calc(var(--header-h) + var(--dash-h));z-index:80;-webkit-overflow-scrolling:touch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{appearance:none;border:0;background:transparent;color:var(--muted);padding:0 14px;min-height:var(--nav-h);font-family:var(--ui);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
nav.tabs button .ix{font-family:var(--mono);font-size:10px;color:var(--dim);font-weight:800}
nav.tabs button:hover{color:var(--text-2)}
nav.tabs button.active{color:var(--neon);border-bottom-color:var(--neon)}
nav.tabs button.active .ix{color:var(--neon)}

/* ----- Main panes ----- */
main{flex:1;padding:14px;max-width:1900px;width:100%;margin:0 auto}
.pane{display:none}
.pane.active{display:block}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface-elev);border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap}
.section-head h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.section-head .tagline{font-size:11px;color:var(--muted);font-weight:500}
.section-body{padding:12px}
.section-body.dense{padding:0}

/* ----- Forms ----- */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;font-weight:800;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.field .help{font-size:10px;color:var(--dim);font-weight:500;letter-spacing:0;text-transform:none}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{
  appearance:none;-webkit-appearance:none;
  background:var(--bg);color:var(--text);
  border:1px solid var(--border);border-radius:var(--r);
  padding:0 10px;min-height:var(--tap);
  font-family:var(--mono);font-size:14px;font-weight:600;
  width:100%;outline:none;transition:border-color .12s,box-shadow .12s
}
textarea{padding:10px;line-height:1.45;font-family:var(--mono);min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 2px var(--neon-soft)}
select{padding-right:30px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%238E8E93' d='M4 6l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 8px center}
input::placeholder,textarea::placeholder{color:var(--dim);font-weight:500}

/* ----- Buttons ----- */
button.btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface-elev);color:var(--text);font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:0 14px;min-height:var(--tap);border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:filter .12s, background .12s}
button.btn:hover{filter:brightness(1.15)}
button.btn:active{transform:translateY(1px)}
button.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.btn.pri:hover{background:#1490FF}
button.btn.ok{background:var(--green);border-color:var(--green);color:#000}
button.btn.warn{background:var(--orange);border-color:var(--orange);color:#000}
button.btn.bad{background:var(--red);border-color:var(--red);color:#fff}
button.btn.neon{background:var(--neon);border-color:var(--neon);color:#000}
button.btn.purple{background:var(--purple);border-color:var(--purple);color:#fff}
button.btn.ghost{background:transparent}
button.btn.sm{font-size:10px;padding:0 8px;min-height:32px}
button.btn.icon{padding:0;width:var(--tap);justify-content:center;font-size:14px}
button.btn:disabled{opacity:.45;cursor:not-allowed}

/* ----- Grids ----- */
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
@media(max-width:900px){
  .g3,.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
  .g2,.g3,.g4,.g6{grid-template-columns:1fr}
  .live{padding:6px 8px}
  .kpi{min-width:108px}
  main{padding:8px}
  .section-head{padding:8px 10px}
  .section-body{padding:8px}
  nav.tabs button{padding:0 10px;font-size:11px}
}

/* ----- Tables / Line items ----- */
.line{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--neon);border-radius:var(--r);padding:10px;margin-bottom:10px}
.line.specialty{border-left-color:var(--purple)}
.line.consumable{border-left-color:var(--orange)}
.line.equip{border-left-color:var(--yellow)}
.line.sub{border-left-color:var(--red)}
.line.task{border-left-color:var(--green)}
.line-grid{display:grid;gap:8px}
.line-grid .field{min-width:0}
.line-foot{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-strong);display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.line-foot .breakdown{font-family:var(--mono);font-size:11px;color:var(--text-2);letter-spacing:0}
.line-foot .breakdown b{color:var(--neon);font-weight:700}
.line-foot .breakdown span{margin-right:10px}
.line-actions{display:flex;gap:4px;flex-wrap:wrap}

/* ----- Sliders (efficiency) ----- */
.slider-row{display:flex;align-items:center;gap:12px;padding:6px 0;flex-wrap:wrap}
.slider-row label{min-width:160px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-2)}
.slider-row input[type=range]{flex:1;min-width:160px;height:var(--tap);background:transparent;-webkit-appearance:none;cursor:pointer}
.slider-row input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--border);border:1px solid var(--border-strong)}
.slider-row input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--border);border:1px solid var(--border-strong)}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--neon);border:2px solid #000;margin-top:-9px;box-shadow:0 0 12px var(--neon-soft)}
.slider-row input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--neon);border:2px solid #000;box-shadow:0 0 12px var(--neon-soft)}
.slider-row .val{font-family:var(--mono);font-weight:800;color:var(--green);font-size:14px;width:54px;text-align:right}

/* ----- Modal ----- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;z-index:200;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);max-width:920px;width:100%;max-height:95vh;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,229,255,.05)}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.modal-head h3{margin:0;font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.modal-body{padding:14px;overflow:auto;flex:1}
.modal-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ----- Toast ----- */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface-elev);color:var(--text);border:1px solid var(--neon);padding:10px 18px;border-radius:var(--r);font-weight:700;font-size:13px;letter-spacing:.04em;box-shadow:0 0 28px var(--neon-soft);z-index:300;animation:fade .25s ease-out;max-width:90vw}
@keyframes fade{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

/* ----- Misc ----- */
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.txt-right{text-align:right}
.center{text-align:center}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--neon-soft);color:var(--neon);border:1px solid var(--neon)}
.pill.warn{background:rgba(255,214,10,.12);border-color:var(--yellow);color:var(--yellow)}
.pill.bad{background:rgba(255,69,58,.12);border-color:var(--red);color:var(--red)}
.pill.ok{background:rgba(50,215,75,.12);border-color:var(--green);color:var(--green)}
.report-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;color:var(--text-2);max-height:62vh;overflow:auto}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text-2);font-size:15px;letter-spacing:.06em;margin-bottom:6px;font-weight:800;text-transform:uppercase}
hr.div{border:0;border-top:1px solid var(--border);margin:14px 0}

/* ----- Sketchpad ----- */
.sketch-wrap{display:grid;grid-template-columns:240px 1fr 240px;gap:8px;height:calc(100vh - 220px);min-height:520px}
@media(max-width:1100px){.sketch-wrap{grid-template-columns:200px 1fr}}
@media(max-width:760px){.sketch-wrap{grid-template-columns:1fr;height:auto}}
.tool-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px;overflow:auto;max-height:100%}
.tool-panel h4{margin:6px 0 4px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:800}
.tool-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tool-btn{flex:1;min-width:84px;background:var(--surface-elev);border:1px solid var(--border);color:var(--text-2);border-radius:4px;padding:8px 6px;font-size:11px;font-weight:700;cursor:pointer;text-align:center;min-height:38px}
.tool-btn.active{background:var(--neon);color:#000;border-color:var(--neon)}
.canvas-wrap{background:#0F0F11;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;position:relative;min-height:520px}
#sketchCanvas{display:block;width:100%;height:100%;touch-action:none;background:#0F0F11;cursor:crosshair}

/* ----- Gantt ----- */
.gantt{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:8px;overflow-x:auto}
.gantt-row{display:flex;align-items:center;border-bottom:1px solid var(--border);min-height:32px}
.gantt-row:last-child{border-bottom:0}
.gantt-name{width:200px;flex-shrink:0;padding:4px 8px;color:var(--text-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-bar{flex:1;position:relative;height:24px}
.bar{position:absolute;top:4px;height:16px;background:var(--surface-elev);border:1px solid var(--border-strong);border-radius:3px;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.bar.done .fill{background:var(--green)}
.bar .lbl{position:absolute;left:6px;top:0;bottom:0;display:flex;align-items:center;font-size:10px;color:#fff;font-weight:700;text-shadow:0 0 4px #000;pointer-events:none}

/* ----- Number badge ----- */
.num-pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-weight:800;font-size:11px;padding:3px 8px;border-radius:99px;background:var(--surface-elev);border:1px solid var(--border-strong);color:var(--text-2)}
.num-pill .n{color:var(--neon)}

/* ----- Print / report ----- */
@media print{
  header.topbar,nav.tabs,.live,.modal-bg,button{display:none!important}
  .pane{display:block!important;page-break-after:always}
  body,html{background:#fff;color:#000}
  .section{border-color:#bbb;page-break-inside:avoid}
  .section-head{background:#eee;color:#000;border-color:#bbb}
  .report-box{color:#000;background:#fff;border-color:#bbb}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">
      <div class="ring"></div>
      <div class="brand">TINGLE ESTIMATOR<small>Pipe • Offline • PC + Android</small></div>
    </div>
    <div class="topbar-actions">
      <button class="btn sm" id="btnNew" title="Start a fresh estimate">+ NEW</button>
      <button class="btn sm pri" id="btnSave">SAVE</button>
      <button class="btn sm" id="btnLoad">LOAD</button>
      <button class="btn sm" id="btnExportJSON">EXPORT</button>
      <button class="btn sm" id="btnImportJSON">IMPORT</button>
      <button class="btn sm ghost" id="btnHelp">?</button>
    </div>
  </header>

  <div class="live" id="liveBar">
    <div class="kpi quote"><span class="lbl">Live Quote</span><span class="val" id="kQuote">$0.00</span></div>
    <div class="kpi mh"><span class="lbl">Adj Man-Hrs</span><span class="val" id="kMH">0.0</span></div>
    <div class="kpi cpm"><span class="lbl">Cost / MH</span><span class="val" id="kCPM">$0.00</span></div>

    <div class="kpi"><span class="lbl">Efficiency</span><span class="val" id="kEff" style="color:#fff">0%</span></div>
  </div>

  <nav class="tabs" id="tabNav"></nav>
  <main id="mainPanes"></main>
</div>

<!-- Modal stack -->
<div class="modal-bg" id="modalRoot"><div class="modal" id="modal">
  <div class="modal-head"><h3 id="modalTitle">—</h3><button class="btn sm ghost" data-close-modal>✕</button></div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-foot" id="modalFoot"></div>
</div></div>

<!-- Hidden file input for JSON import -->
<input type="file" id="fileImport" accept=".json,application/json" style="display:none" />

  "1-1/2": [0.14,0.18,0.60,0.80,0.30,0.75,2.72,0.106,0.30,0.20,6.0,1.900,1.5],
  "2":     [0.15,0.22,0.75,1.00,0.35,1.00,3.65,0.170,0.40,0.25,8.0,2.375,2.0],
  "2-1/2": [0.18,0.26,0.90,1.25,0.45,1.10,5.79,0.250,0.50,0.30,10.0,2.875,2.5],

/* Architectural fraction parser: "12'-6 1/2\"" <-> 12.5417 ft */
function toArch(dec){
  if(!isFinite(dec)) return '';
  if(dec===0) return '0"';
  const neg = dec<0; dec = Math.abs(dec);
  const ft = Math.floor(dec);
  let rem = (dec-ft)*12;
  let ins = Math.floor(rem);
  let sixt = Math.round((rem-ins)*16);
  if(sixt===16){ins++;sixt=0}
  let inStr = ins>0?ins+'':'';
  if(sixt>0){
    const g = (a,b)=>b?g(b,a%b):a;
    const d = g(sixt,16);
    inStr += (inStr?' ':'') + (sixt/d)+'/'+(16/d);
  }
  let out='';
  if(ft>0) out += ft+"'-";
  if(inStr) out += inStr+'"';
  else if(ft>0) out = ft+"'";
  return (neg?'-':'')+out;
}
function parseArch(s){
  if(s==null) return 0;
  const v = String(s).trim().replace(/"/g,'');
  if(!v) return 0;
  if(/^-?[0-9.]+$/.test(v)) return parseFloat(v);
  // 12'-6 1/2  or  12' 6-1/2
  let ft=0, inP='';
  if(v.includes("'")){const p=v.split("'");ft=parseFloat(p[0])||0;inP=p[1]||'';}
  else inP = v;
  inP = inP.replace(/-/g,' ').trim();
  let totalIn = 0;
  for(const tok of inP.split(/\s+/).filter(Boolean)){
    if(tok.includes('/')){const [a,b]=tok.split('/');totalIn += (parseFloat(a)||0)/(parseFloat(b)||1);}
    else totalIn += parseFloat(tok)||0;
  }
  return ft + totalIn/12;
}

/* =========================================================================
 *  SECTION 3 — CALCULATION ENGINE
 *  Faithful to estimator_v2.py + Estimation-main/calc.js with extensions:
 *    - Material factor (additive on labor)
 *    - Shift multiplier
 *    - Bare-pipe weld count from LF/20 + multi-size BOM
 *    - Hydrotest volume (gal) and paint area (SF) computed automatically
 *    - Pipe steel weight (lbs) totalled
 *    - NDT shot count rounded UP from joints×pct
 * ===================================================================== */
function calcSpool(s){
  const nps  = s.NPS || '2';
  const base = PIPE_DB[nps] || PIPE_DB['2'];
  const schM = SCHEDULE_MULT[s.Schedule] ?? 1.0;
  const wm   = WELD_TYPE_MULT[s["Weld Type"]] ?? 1.0;
  const cf   = CONNECTION_FACTORS[s.Connection] || {fit:1,join:1};
  const mat  = MATERIAL_FACTORS[s.Material] ?? 1.0;
  const fm   = (s["Fab Loc"]==='Shop') ? 0.70 : 1.0;
  const em   = ELEVATION_MULT[s.Elevation] ?? 1.0;
  const lm   = LAYOUT_MULT[s.Layout] ?? 1.0;
  const cm   = CONGESTION_MULT[s.Congestion] ?? 1.0;
  const dm   = DIFFICULTY_MULT[s.Difficulty] ?? 1.0;
  const sm   = SHIFT_MULT[s.Shift] ?? 1.0;
  const hM   = HANGER_FACTORS[s["Hang Type"]] ?? 1.0;
  const bom  = Array.isArray(s.bom) ? s.bom : [];
  const hq   = num(s["Qty Hang"]);

  let pLay=0,pEr=0,pFit=0,pW=0,pH=0,di=0,joinCnt=0,lfTotal=0,wtLbs=0,paintSF=0,hydroGal=0;

  const ALL = lm*cm*em*dm*fm*mat*sm;
  const ERECT = cm*em*dm*fm*mat*sm;
  const FIT = cf.fit*cm*em*dm*fm*mat*sm;
  const JOIN = cf.join*wm*schM*cm*dm*fm*mat*sm;

  if(bom.length){
    for(const it of bom){
      const sizeStr = String(it.size||'').split('x')[0].replace(/"/g,'').trim();
      const b = PIPE_DB[sizeStr] || base;
      const q = num(it.qty);
      if(!q) continue;
      if(/Bare Pipe/i.test(it.type||'')){
        pLay += q * b[0] * ALL;
        pEr  += q * b[1] * ERECT;
        const sjoints = q/20;
        pW   += sjoints * b[3] * JOIN;
        di   += sjoints * b[12];
        joinCnt += sjoints;
        lfTotal += q;
        wtLbs += q * b[6];
        paintSF += q * (Math.PI * b[11]) / 12;
        hydroGal += q * Math.PI * Math.pow(((b[11] - 2*estWall(b[11], s.Schedule))/2)/12, 2) * 7.4805;
      } else {
        pFit += q * b[2] * FIT;
        const wCount = (MULTI_MULTIPLIERS[it.type] ?? 2) * q;
        pW += wCount * b[3] * JOIN;
        di += wCount * b[12];
        joinCnt += wCount;
      }
    }
  } else {
    const lf = num(s.LF), fq = num(s["Qty Fit"]), wq = num(s["Qty Join"]);
    pLay = lf * base[0] * ALL;
    pEr  = lf * base[1] * ERECT;
    pFit = fq * base[2] * FIT;
    pW   = wq * base[3] * JOIN;
    di   = wq * base[12];
    joinCnt = wq;
    lfTotal = lf;
    wtLbs = lf * base[6];
    paintSF = lf * (Math.PI * base[11]) / 12;
    hydroGal = lf * Math.PI * Math.pow(((base[11] - 2*estWall(base[11], s.Schedule))/2)/12, 2) * 7.4805;
  }
  pH = hq * base[5] * hM * em * cm;
  const total = pLay+pEr+pFit+pW+pH;
  return { lay:pLay, erect:pEr, fit:pFit, join:pW, hang:pH, total, di, joinCnt, lfTotal, wtLbs, paintSF, hydroGal };
}
/* Quick wall-thickness estimator from OD + schedule for hydrotest volume.
   Returns wall in inches. Curve fit to ANSI B36.10 standard table. */
function estWall(od, sched){
  const t = {"Sch 5":0.045,"Sch 10":0.065,"Sch 20":0.080,"Sch 30":0.10,
             "Sch 40":0.135,"Sch 60":0.18,"Sch 80":0.230,"Sch 100":0.28,
             "Sch 120":0.32,"Sch 140":0.40,"Sch 160":0.50,
             "STD":0.135,"XH":0.230,"XXH":0.500}[sched] || 0.135;
  // Scale lightly with OD - manual confirms heavier wall above 12"
  return Math.max(0.04, t * Math.pow(Math.max(od,0.5)/4.5, 0.20));
}
function calcConsumable(c){
  const wq = num(c["Qty Welds"]);
  const time = num(c["Weld Time (Hrs/ea)"]);
  const pFlow = num(c["Purge Flow (CFH)"]);
  const pLen  = num(c["Line Length (LF)"]);
  const sFlow = num(c["Shield Flow (CFH)"]);
  const lbsEa = num(c["Rod/Wire (lbs/ea)"]);
  const cuts  = num(c["Qty Cuts"]);
  const b = PIPE_DB[c.NPS] || PIPE_DB['2'];
  const purge = c["Purge Type"]!=='None'
    ? Math.PI*Math.pow((b[11]/2)/12,2)*pLen*4 + pFlow*time*wq
    : 0;
  const shield = c["Shield Type"]!=='None' ? sFlow*time*wq : 0;
  return { lbs:lbsEa*wq, purgeCF:purge, shieldCF:shield, cutWheels:cuts*b[9] };
}
function totalEfficiency(eff){
  const v = Object.values(eff||{});
  if(!v.length) return 1.0;
  return v.reduce((a,b)=>a+b,0)/(v.length*100);
}
function rollUp(){
  const P = PROJECT;
  const spools = P.spools.map(calcSpool);
  const specs  = P.specs.map(s => num(s.Quantity) * (SPEC_OPS_DB[s.Operation] ?? 0));
  const equips = P.equips.map(e => num(e.Duration) * (EQUIP_DB[e.Equipment] ?? 0));
  const subs   = P.subs.map(s => num(s.Cost));
  const cons   = P.cons.map(calcConsumable);

  const rawMH = spools.reduce((a,b)=>a+b.total,0) + specs.reduce((a,b)=>a+b,0);
  const totalDI = spools.reduce((a,b)=>a+b.di,0);
  const totalJoins = spools.reduce((a,b)=>a+b.joinCnt,0);
  const totalLF = spools.reduce((a,b)=>a+b.lfTotal,0);
  const totalWt = spools.reduce((a,b)=>a+b.wtLbs,0);
  const totalPaint = spools.reduce((a,b)=>a+b.paintSF,0);
  const totalHydro = spools.reduce((a,b)=>a+b.hydroGal,0);

  const eff = totalEfficiency(P.efficiency);
  const adjMH = eff>0 ? rawMH/eff : rawMH;

  const r = P.rates;
  const consCost = cons.reduce((a,c)=>
    a + c.lbs*num(r.rodCost,3.5)
      + (c.purgeCF + c.shieldCF) * num(r.argonCost,0.4)
      + c.cutWheels * num(r.wheelCost,4.25), 0);
  const equipCost = equips.reduce((a,b)=>a+b,0);
  const subCost = subs.reduce((a,b)=>a+b,0);
  const tax = consCost * (num(r.salesTax,8.5)/100);

  const ndtCount = Math.ceil(totalJoins * (num(r.ndtPct,10)/100));
  const ndtCost = ndtCount * num(r.ndtShot,150);

  let manDays = 0, maxDay = 0;
  const mpByDay = {};
  P.tasks.forEach(t=>{
    const start = num(t["Start Day"]);
    const dur   = num(t["Duration (Days)"]);
    const crew  = num(t["Crew Size"]);
    manDays += crew * dur;
    const end = start + dur;
    if(end>maxDay) maxDay = end;
    for(let d=start; d<end; d++) mpByDay[d] = (mpByDay[d]||0) + crew;
  });
  const perDiemCost = manDays * num(r.perDiem,150);
  const peakMP = Object.values(mpByDay).length ? Math.max(...Object.values(mpByDay)) : 0;

  const laborCost = adjMH * num(r.laborRate,65);
  const directs = laborCost + equipCost + consCost + subCost + tax + ndtCost + perDiemCost;
  const overhead = directs * (num(r.overhead,8)/100);
  const bond = directs * (num(r.bondInsurance,1.5)/100);
  const subtotal = directs + overhead + bond;
  const total = subtotal * (1 + num(r.profit,15)/100);
  const costPerMH = adjMH>0 ? total/adjMH : 0;

  return { rawMH, adjMH, totalDI, costPerMH, eff, laborCost, consCost, equipCost,
    subCost, tax, ndtCost, perDiemCost, overhead, bond, directs, subtotal, total,
    manDays, maxDay, peakMP, ndtCount, totalJoins, totalLF, totalWt, totalPaint, totalHydro,
    spools, specs, equips, subs, cons };
}

const $  = (q, root=document) => root.querySelector(q);
const $$ = (q, root=document) => Array.from(root.querySelectorAll(q));
function h(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='style') e.style.cssText = attrs[k];
    else if(k.startsWith('on') && typeof attrs[k]==='function') e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if(attrs[k]!==undefined && attrs[k]!==null) e.setAttribute(k, attrs[k]);
  }
  for(const c of children){
    if(c==null) continue;
    if(Array.isArray(c)) c.forEach(x=>e.appendChild(typeof x==='string'?document.createTextNode(x):x));
    else e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

function fieldText(label, val, onInput, opts={}){
  const inp = h('input',{type:opts.type||'text',value:val??'',placeholder:opts.ph||'',oninput:e=>onInput(e.target.value)});
  if(opts.inputmode) inp.setAttribute('inputmode', opts.inputmode);
  if(opts.testid) inp.setAttribute('data-testid', opts.testid);
  return h('div',{class:'field'},
    h('label', null, label),
    inp,
    opts.help?h('div',{class:'help'}, opts.help):null
  );
}
function fieldNum(label, val, onInput, opts={}){
  return fieldText(label, val, v=>onInput(v), Object.assign({inputmode:'decimal',type:'text'}, opts));
}
function fieldSel(label, val, options, onChange, opts={}){
  const sel = h('select',{onchange:e=>onChange(e.target.value)});
  for(const o of options){
    const op = h('option',{value:o}, o);
    if(o===val) op.setAttribute('selected','');
    sel.appendChild(op);
  }
  return h('div',{class:'field'}, h('label', null, label), sel, opts.help?h('div',{class:'help'}, opts.help):null);
}
function fieldSlider(label, val, onChange, min=40, max=100){
  const row = h('div',{class:'slider-row'});
  const lab = h('label', null, label);
  const valEl = h('span',{class:'val'}, val+'%');
  const slider = h('input',{type:'range',min,max,step:1,value:val});
  slider.addEventListener('input', e=>{
    const v = parseInt(e.target.value);
    valEl.textContent = v+'%';
    onChange(v);
  });
  row.append(lab, slider, valEl);
  return row;
}

/* ----- crew composite rate row helper ----- */
const _crew = { gf:{hrs:2,rate:28}, fm:{hrs:8,rate:27}, jm:{hrs:80,rate:25}, ap:{hrs:8,rate:19} };
function crewCompRow(name, key, defHrs, defRate){
  return h('div',{class:'grid g4', style:'margin-top:6px'},
    h('div',{class:'mono', style:'align-self:center;font-size:12px'}, name),
    h('input',{type:'text',inputmode:'decimal',value:defHrs, oninput:e=>{_crew[key].hrs=num(e.target.value); updateCompRate();}}),
    h('input',{type:'text',inputmode:'decimal',value:defRate, oninput:e=>{_crew[key].rate=num(e.target.value); updateCompRate();}}),
    h('div',{class:'mono txt-right', id:'cr_'+key, style:'align-self:center;color:var(--text-2)'}, '$'+(defHrs*defRate).toFixed(2))
  );
}
function updateCompRate(){
  let totalHrs=0, totalCost=0;
  for(const k in _crew){
    const h = _crew[k].hrs, r=_crew[k].rate, sub=h*r;
    totalHrs += h; totalCost += sub;
    const el=document.getElementById('cr_'+k); if(el) el.textContent='$'+sub.toFixed(2);
  }
  const comp = totalHrs>0 ? totalCost/totalHrs : 0;
  const outEl = document.getElementById('compRateOut');
  const hrsEl = document.getElementById('compRateTotalHrs');
  if(outEl) outEl.textContent = '$'+comp.toFixed(2)+'/hr';
  if(hrsEl) hrsEl.textContent = totalHrs.toFixed(0);
  window._lastComp = comp;
}
function applyCompRate(){
  if(!window._lastComp){ toast('Enter crew data first', true); return; }
  PROJECT.rates.laborRate = Math.round(window._lastComp*100)/100;
  toast('Composite rate applied: $'+PROJECT.rates.laborRate.toFixed(2)+'/hr');
  buildProjectTab(); redraw();
}

function importSpoolsFromSketch(){
  const objs=PROJECT.sketch.objs;
  const pipes=objs.filter(o=>o.type==='Pipe');
  if(!pipes.length){toast('No pipe runs on sketchpad',true);return;}
  pipes.forEach(o=>{
    const s=defaultSpool();
    s.Tag=o.tag||'Sketch-'+PROJECT.spools.length;
    s.NPS=o.size||'2';
    s.LF=String((o.length||0).toFixed(1));
    PROJECT.spools.push(s);
  });

  toast('Imported '+pipes.length+' runs from sketchpad');
}

/* Detailed BOM modal */
function openBOMModal(idx){
  const s=PROJECT.spools[idx];
  const rows=[...s.bom];
  const container=h('div');
  const hdr=h('div',{class:'grid',style:'grid-template-columns:130px 1fr 80px 36px;gap:6px;margin-bottom:6px'},
    h('div',{class:'muted',style:'font-size:10px;font-weight:800;letter-spacing:.12em'},'SIZE'),
    h('div',{class:'muted',style:'font-size:10px;font-weight:800;letter-spacing:.12em'},'COMPONENT'),
    h('div',{class:'muted',style:'font-size:10px;font-weight:800;letter-spacing:.12em'},'QTY/LF'),
    h('div'));
  const rowsEl=h('div');
  container.append(hdr,rowsEl);
  const render=()=>{
    rowsEl.innerHTML='';
    rows.forEach((r,i)=>{
      const sizeInp=h('input',{type:'text',value:r.size||s.NPS,oninput:e=>rows[i].size=e.target.value});
      const typeSel=h('select',{onchange:e=>rows[i].type=e.target.value});
      Object.keys(MULTI_MULTIPLIERS).forEach(o=>{const op=h('option',{value:o},o);if(o===r.type)op.setAttribute('selected','');typeSel.appendChild(op);});
      const qtyInp=h('input',{type:'text',inputmode:'decimal',value:r.qty||'',oninput:e=>rows[i].qty=e.target.value});
      const delBtn=h('button',{class:'btn sm bad icon',onclick:()=>{rows.splice(i,1);render();}},'✕');
      rowsEl.appendChild(h('div',{class:'grid',style:'grid-template-columns:130px 1fr 80px 36px;gap:6px;margin-bottom:6px'},sizeInp,typeSel,qtyInp,delBtn));
    });
  };
  render();
  const addBtn=h('button',{class:'btn',onclick:()=>{rows.push({size:s.NPS,type:'Bare Pipe (LF)',qty:''});render();}},'+ Add Row');
  const saveBtn=h('button',{class:'btn ok',onclick:()=>{
    s.bom=rows.filter(r=>r.qty&&parseFloat(r.qty)>0);
    // Auto-compute LF and fit from BOM
    let lf=0,fit=0,join=0;
    s.bom.forEach(r=>{
      const q=parseFloat(r.qty)||0;
      if(/Bare Pipe/i.test(r.type)){lf+=q;join+=q/20;}
      else{fit+=q;join+=(MULTI_MULTIPLIERS[r.type]||2)*q;}
    });
    s.LF=lf.toFixed(1); s['Qty Fit']=Math.round(fit)+''; s['Qty Join']=Math.round(join)+'';
    saveCurrent(); buildTakeoffTab(); redraw(); closeModal();
    toast('BOM saved');
  }},'SAVE BOM');
  const foot=h('div',{style:'display:flex;gap:8px'}); foot.append(addBtn,saveBtn);
  openModal('Detailed BOM — '+s.Tag, container, foot);
}

window.calcMacros=function(){
  const totMH=PROJECT.tasks.reduce((a,t)=>a+(parseFloat(t['Est MH'])||0),0);
  const shift=parseFloat(document.getElementById('macShift')?.value)||10;
  const crew=parseFloat(document.getElementById('macCrew')?.value)||1;
  const target=parseFloat(document.getElementById('macTarget')?.value)||1;
  const el=id=>document.getElementById(id);
  if(el('macTotMH')) el('macTotMH').value=fmt1(totMH);
  if(el('macDays')) el('macDays').value=fmt1(totMH/(crew*shift)||0);
  if(el('macReqCrew')) el('macReqCrew').value=fmt1(totMH/(target*shift)||0);
};
function defaultTask(name='New Task',mh=0){ return{id:uid(),'Task Name':name,'Est MH':mh.toFixed(1),'Crew Size':'2','Shift Hrs':'10','Start Day':'1','Duration (Days)':'1','% Complete':'0',Status:'Not Started'}; }
function addTask(){ PROJECT.tasks.push(defaultTask()); saveCurrent(); appendTaskLine(PROJECT.tasks.length-1); calcMacros(); renderGantt(); }
function importTasksFromTakeoff(){
  PROJECT.spools.forEach(s=>{
    const r=calcSpool(s);
    if(r.total>0) PROJECT.tasks.push(defaultTask(s.Tag,r.total));
  });
  PROJECT.specs.forEach(s=>{
    const mh=(parseFloat(s.Quantity)||0)*(SPEC_OPS_DB[s.Operation]||0);
    if(mh>0) PROJECT.tasks.push(defaultTask('Spec: '+s.Operation,mh));
  });
  saveCurrent(); buildSchedTab(); redraw(); toast('Tasks imported');
}
function appendTaskLine(idx){
  const con=$('#taskContainer'); if(!con) return;
  const t=PROJECT.tasks[idx];
  const autoCalc=()=>{
    const mh=parseFloat(t['Est MH'])||0, crew=parseFloat(t['Crew Size'])||1, shift=parseFloat(t['Shift Hrs'])||10;
    const days=Math.max(1,Math.ceil(mh/(crew*shift)));
    t['Duration (Days)']=days+'';
    const el=line.querySelector('.dur-inp'); if(el) el.value=days;
    const pct=parseFloat(t['% Complete'])||0;
    t.Status=pct>=100?'Complete':pct>0?'Active':'Not Started';
    const stEl=line.querySelector('.stat-inp'); if(stEl) stEl.value=t.Status;
    saveCurrent(); calcMacros(); renderGantt(); redrawDash();
  };
  const line=h('div',{class:'line task'});
  const mk=(lbl,key,inp)=>{const f=h('div',{class:'field'},h('label',null,lbl),inp);inp.addEventListener('input',()=>{t[key]=inp.value;autoCalc();});return f;};
  const mhI=h('input',{type:'text',inputmode:'decimal',value:t['Est MH']});
  const crI=h('input',{type:'text',inputmode:'decimal',value:t['Crew Size']});

  ['Not Started','Active','Complete'].forEach(s=>{const op=h('option',{value:s},s);if(s===t.Status)op.setAttribute('selected','');statSel.appendChild(op);});
  const nameInp=h('input',{type:'text',value:t['Task Name'],oninput:e=>{t['Task Name']=e.target.value;saveCurrent();renderGantt();}});
  const del=h('button',{class:'btn sm bad',onclick:()=>{PROJECT.tasks.splice(idx,1);saveCurrent();buildSchedTab();redraw();}},'✕');
  [mhI,crI,shI,stI,durI,pctI].forEach(i=>i.addEventListener('input',()=>{}));
  const grid=h('div',{class:'line-grid',style:'grid-template-columns:1fr 80px 70px 70px 70px 80px 70px 110px auto'});
  grid.append(
    h('div',{class:'field'},h('label',null,'Task Name'),nameInp),
    mk('Est MH','Est MH',mhI), mk('Crew','Crew Size',crI), mk('Shift Hrs','Shift Hrs',shI),
    mk('Start Day','Start Day',stI), mk('Duration','Duration (Days)',durI), mk('% Done','% Complete',pctI),
    h('div',{class:'field'},h('label',null,'Status'),statSel),
    h('div',{style:'display:flex;align-items:flex-end;padding-bottom:2px'},del)
  );
  line.appendChild(grid);
  con.appendChild(line);
}
function renderGantt(){
  const el=document.getElementById('ganttEl'); if(!el) return;
  el.innerHTML='';
  if(!PROJECT.tasks.length){el.innerHTML='<div class="empty"><b>No Tasks</b>Add tasks or import from takeoff.</div>';return;}
  const maxDay=PROJECT.tasks.reduce((mx,t)=>Math.max(mx,(parseFloat(t['Start Day'])||0)+(parseFloat(t['Duration (Days)'])||0)),0)||30;
  const hdr=h('div',{class:'gantt-row'});
  hdr.append(h('div',{class:'gantt-name',style:'color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em'},'Task'));
  const scale=h('div',{class:'gantt-bar',style:'position:relative;height:20px'});
  for(let d=0;d<=maxDay;d+=Math.max(1,Math.round(maxDay/10))){
    scale.appendChild(h('span',{style:`position:absolute;left:${(d/maxDay*100).toFixed(1)}%;top:2px;font-size:9px;color:var(--dim)`},'D'+d));
  }
  hdr.appendChild(scale); el.appendChild(hdr);
  PROJECT.tasks.forEach(t=>{
    const start=parseFloat(t['Start Day'])||0, dur=parseFloat(t['Duration (Days)'])||0;
    const pct=Math.min(100,parseFloat(t['% Complete'])||0)/100;
    const isComplete=t.Status==='Complete';
    const row=h('div',{class:'gantt-row'});
    row.append(h('div',{class:'gantt-name'},t['Task Name']||'—'));
    const barWrap=h('div',{class:'gantt-bar'});
    const bar=h('div',{class:'bar'+(isComplete?' done':''),style:`left:${(start/maxDay*100).toFixed(1)}%;width:${(dur/maxDay*100).toFixed(1)}%`});
    const fill=h('div',{class:'fill',style:`width:${(pct*100).toFixed(0)}%`});
    const lbl=h('div',{class:'lbl'},`${dur}d Crew:${t['Crew Size']||1} ${(pct*100).toFixed(0)}%`);
    bar.append(fill,lbl); barWrap.appendChild(bar); row.appendChild(barWrap);
    el.appendChild(row);
  });
}

function buildPipeLookup(){
  const sec=h('div',{class:'section'});
  sec.innerHTML='<div class="section-head"><h3>Pipe Properties Quick Look-Up</h3><span class="tagline">From PIPE_DB — select NPS to see all params</span></div>';
  const body=h('div',{class:'section-body'});
  const npsS=h('select',{style:'margin-bottom:12px'});
  NPS_LIST.forEach(n=>{const op=h('option',{value:n},n+'"');npsS.appendChild(op);});
  const tbl=h('div',{class:'report-box'});
  const showPipe=nps=>{
    const b=PIPE_DB[nps];
    if(!b){tbl.textContent='Not found';return;}
    const od=b[11], id_sch40=(od-2*estWall(od,'Sch 40'));
    const paintPerLF=(Math.PI*od/12).toFixed(3);
    const hydroPerLF=(Math.PI*Math.pow(id_sch40/2/12,2)*7.4805).toFixed(3);
    tbl.textContent=
      `NPS: ${nps}" \n`+
      `OD: ${od}" \n`+
      `Weight (Sch 40): ${b[6]} lbs/ft \n`+

      `Erect MH/LF: ${b[1]} \n`+
      `Fit MH/ea:   ${b[2]} \n`+
      `Weld MH/ea:  ${b[3]} \n`+
      `Handle MH/ea:${b[4]} \n`+
      `Hanger MH/ea:${b[5]} \n`+
      `Cut MH/ea:   ${b[7]} \n`+
      `Paint MH/LF: ${b[8]} \n`+
      `Cut Wheels/cut:${b[9]} \n`+
      `DI per weld: ${b[12]} \n`+
      `Paint SF/LF: ${paintPerLF} \n`+
      `Hydro Gal/LF (Sch 40 approx): ${hydroPerLF}`;
  };
  npsS.addEventListener('change',e=>showPipe(e.target.value));
  showPipe(NPS_LIST[7]);

}

  if(!CANVAS) return;
  const getXY=e=>{
    const r=CANVAS.getBoundingClientRect();
    if(e.touches){return{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};}
    return{x:e.clientX-r.left,y:e.clientY-r.top};
  };
  const onDown=e=>{
    e.preventDefault();
    const {x,y}=getXY(e);
    startX=snap(x); startY=snap(y); curX=startX; curY=startY; dragging=true;
    if(ISO_MODE==='Select'){
      selectedId=null;
      const hit=PROJECT.sketch.objs.slice().reverse().find(o=>hitTest(o,x,y));
      if(hit){ selectedId=hit.id; showProps(hit); }
      drawSketch(); return;
    }
    if(!['Pipe (90°)','Pipe (45°)','Inst Tubing'].includes(ISO_MODE)){
      placeSymbol(startX,startY); dragging=false;
    }
  };
  const onMove=e=>{
    if(!dragging) return; e.preventDefault();
    const {x,y}=getXY(e);
    if(['Pipe (90°)','Pipe (45°)','Inst Tubing'].includes(ISO_MODE)){
      let dx=x-startX, dy=y-startY;
      if(ISO_MODE==='Pipe (90°)'){
        if(Math.abs(dx)>Math.abs(dy)) dy=0; else dx=0;
      } else if(ISO_MODE==='Pipe (45°)'){
        const len=Math.hypot(dx,dy)/Math.SQRT2;
        dx=len*Math.sign(dx); dy=len*Math.sign(dy);
      }
      curX=startX+dx; curY=startY+dy;
      drawSketch();
      // Preview line
      CTX.save(); CTX.strokeStyle='rgba(0,229,255,.5)'; CTX.lineWidth=ISO_MODE==='Inst Tubing'?1:3;
      CTX.setLineDash([6,4]); CTX.beginPath(); CTX.moveTo(startX,startY); CTX.lineTo(curX,curY); CTX.stroke();
      CTX.restore();
    }
  };
  const onUp=e=>{
    if(!dragging) return; dragging=false;
    if(['Pipe (90°)','Pipe (45°)','Inst Tubing'].includes(ISO_MODE)){
      const len=Math.hypot(curX-startX,curY-startY);
      if(len<10) return;
      const id=uid(); const px2ft=40;
      const obj={id,type:'Pipe',pipeType:ISO_MODE==='Inst Tubing'?'Inst':'Process',
        x1:startX,y1:startY,x2:curX,y2:curY,length:len/px2ft,
        size:ISO_SIZE,color:ISO_COLOR,tag:'P-'+PROJECT.sketch.objs.filter(o=>o.type==='Pipe').length.toString().padStart(3,'0')};
      PROJECT.sketch.objs.push(obj); undoStack.push(id); drawSketch(); saveCurrent();
    }
  };
  CANVAS.addEventListener('mousedown',onDown);
  CANVAS.addEventListener('mousemove',onMove);
  CANVAS.addEventListener('mouseup',onUp);
  CANVAS.addEventListener('touchstart',onDown,{passive:false});
  CANVAS.addEventListener('touchmove',onMove,{passive:false});
  CANVAS.addEventListener('touchend',onUp,{passive:false});
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();if(undoStack.length){const id=undoStack.pop();PROJECT.sketch.objs=PROJECT.sketch.objs.filter(o=>o.id!==id);drawSketch();saveCurrent();}}});
}
function snap(v,grid=20){return Math.round(v/grid)*grid;}
function hitTest(o,x,y){
  if(o.type==='Pipe'){
    const dx=o.x2-o.x1,dy=o.y2-o.y1;
    const t=Math.max(0,Math.min(1,((x-o.x1)*dx+(y-o.y1)*dy)/(dx*dx+dy*dy)));
    const nx=o.x1+t*dx,ny=o.y1+t*dy;
    return Math.hypot(x-nx,y-ny)<14;
  }
  return Math.hypot(x-(o.x||o.x1||0),y-(o.y||o.y1||0))<18;
}
function showProps(o){
  const el=document.getElementById('sketchProps'); if(!el) return;
  if(o.type==='Pipe') el.textContent=`ID: ${o.id.slice(-6)}\nType: ${o.pipeType}\nNPS: ${o.size}"\nLength: ${o.length.toFixed(2)} ft\nColor: ${o.color}`;
  else el.textContent=`ID: ${o.id.slice(-6)}\nType: ${o.type}\nNPS: ${o.size||'—'}\nX: ${(o.x||0).toFixed(0)} Y: ${(o.y||0).toFixed(0)}`;
}
function placeSymbol(x,y){
  const id=uid();
  const type=ISO_MODE.replace(/\(.*\)/,'').trim();
  const obj={id,type,x,y,rot:0,size:ISO_SIZE,color:ISO_COLOR,text:type==='Text Label'?'Label':type==='Tie-In Point'?'TP':''};
  PROJECT.sketch.objs.push(obj); undoStack.push(id); selectedId=id; drawSketch(); saveCurrent(); showProps(obj);
}
function drawSketch(){
  if(!CTX||!CANVAS) return;
  const W=CANVAS.width,H=CANVAS.height;
  CTX.fillStyle='#0F0F11'; CTX.fillRect(0,0,W,H);
  // Grid
  CTX.strokeStyle='rgba(44,44,46,0.9)'; CTX.lineWidth=.5;
  for(let x=0;x<W;x+=20){CTX.beginPath();CTX.moveTo(x,0);CTX.lineTo(x,H);CTX.stroke();}
  for(let y=0;y<H;y+=20){CTX.beginPath();CTX.moveTo(0,y);CTX.lineTo(W,y);CTX.stroke();}
  // Isometric guide lines (30°)
  CTX.strokeStyle='rgba(0,229,255,0.04)'; CTX.lineWidth=.5;
  const tan30=Math.tan(Math.PI/6);
  for(let y=-H;y<H*2;y+=40){CTX.beginPath();CTX.moveTo(0,y);CTX.lineTo(W,y+W*tan30);CTX.stroke();CTX.beginPath();CTX.moveTo(0,y);CTX.lineTo(W,y-W*tan30);CTX.stroke();}
  // Objects
  PROJECT.sketch.objs.forEach(o=>{
    const sel=(o.id===selectedId);
    CTX.strokeStyle=sel?'#fff':o.color||'#00E5FF';
    CTX.fillStyle=sel?'rgba(255,255,255,.15)':'rgba(0,0,0,.6)';
    CTX.lineWidth=sel?4:2.5;
    drawObj(o);
  });
  // Snap nodes
  CTX.fillStyle='rgba(0,229,255,.4)';
  PROJECT.sketch.objs.filter(o=>o.type==='Pipe').forEach(o=>{
    [[o.x1,o.y1],[o.x2,o.y2]].forEach(([x,y])=>{CTX.beginPath();CTX.arc(x,y,5,0,Math.PI*2);CTX.fill();});
  });
}
function rot(cx,cy,pts,deg){
  const rad=deg*Math.PI/180, cos=Math.cos(rad), sin=Math.sin(rad), out=[];
  for(let i=0;i<pts.length;i+=2){const x=pts[i]-cx,y=pts[i+1]-cy;out.push(x*cos-y*sin+cx,x*sin+y*cos+cy);}
  return out;
}
function drawObj(o){
  const c=CTX; const x=o.x||0,y=o.y||0,r=o.rot||0;
  if(o.type==='Pipe'){
    c.beginPath(); c.moveTo(o.x1,o.y1); c.lineTo(o.x2,o.y2);
    c.lineWidth=o.pipeType==='Inst'?1.5:3; c.stroke();
    if(o.length){
      const mx=(o.x1+o.x2)/2,my=(o.y1+o.y2)/2;
      const ang=Math.atan2(o.y2-o.y1,o.x2-o.x1)*180/Math.PI;
      c.save(); c.translate(mx,my); c.rotate((ang>90||ang<-90?ang+180:ang)*Math.PI/180);
      c.fillStyle=o.color||'#00E5FF'; c.font='bold 10px monospace'; c.textAlign='center';
      c.fillText(toArch(o.length),0,-5); c.restore();
    }
    if(o.tag){c.fillStyle='rgba(255,255,255,.6)';c.font='9px monospace';c.fillText(o.tag,(o.x1+o.x2)/2,(o.y1+o.y2)/2+12);}
    return;
  }
  c.save(); c.translate(x,y); c.rotate(r*Math.PI/180);
  const t=o.type;
  if(/Valve|Butterfly/.test(t)){
    c.beginPath(); c.moveTo(-14,-10); c.lineTo(-14,10); c.lineTo(14,-10); c.lineTo(14,10); c.closePath(); c.stroke(); c.fill();
    if(/Control/.test(t)){c.beginPath();c.moveTo(0,0);c.lineTo(0,-16);c.arc(0,-20,4,0,Math.PI*2);c.stroke();}
    if(/Check/.test(t)){c.beginPath();c.moveTo(-14,0);c.lineTo(14,0);c.moveTo(0,-10);c.lineTo(0,10);c.stroke();}
  } else if(/Weld Neck|Slip-On|Blind|Flange Pair/.test(t)){
    c.lineWidth=4; c.beginPath(); c.moveTo(0,-16); c.lineTo(0,16); c.stroke();
    if(/Pair/.test(t)){c.beginPath();c.moveTo(4,-16);c.lineTo(4,16);c.stroke();}
  } else if(/Reducer/.test(t)){
    c.beginPath(); c.moveTo(-12,-10); c.lineTo(-12,10); c.lineTo(12,0); c.closePath(); c.stroke(); c.fill();
  } else if(/Field Weld/.test(t)){
    c.beginPath(); c.arc(0,0,6,0,Math.PI*2); c.fillStyle=o.color||'#00E5FF'; c.fill();
  } else if(/Pipe Support/.test(t)){
    c.beginPath(); c.arc(0,-5,10,Math.PI,0); c.lineTo(0,10); c.moveTo(-14,10); c.lineTo(14,10); c.stroke();
  } else if(/Dummy Leg/.test(t)){
    c.lineWidth=5; c.beginPath(); c.moveTo(0,0); c.lineTo(0,30); c.stroke(); c.lineWidth=8; c.beginPath(); c.moveTo(-12,30); c.lineTo(12,30); c.stroke();
  } else if(/Pump/.test(t)){
    c.beginPath(); c.arc(0,0,14,0,Math.PI*2); c.stroke(); c.fill();
    c.beginPath(); c.moveTo(-18,0); c.lineTo(-5,0); c.moveTo(5,-10); c.lineTo(0,0); c.lineTo(5,10); c.stroke();
  } else if(/Tank/.test(t)){
    c.beginPath(); c.ellipse(0,-22,18,8,0,0,Math.PI*2); c.stroke(); c.fill();
    c.beginPath(); c.ellipse(0,22,18,8,0,0,Math.PI*2); c.stroke(); c.fill();
    c.beginPath(); c.moveTo(-18,-22); c.lineTo(-18,22); c.moveTo(18,-22); c.lineTo(18,22); c.stroke();
  } else if(/Tie-In/.test(t)){
    c.beginPath(); c.moveTo(-14,-10); c.lineTo(14,-10); c.lineTo(20,0); c.lineTo(14,10); c.lineTo(-14,10); c.lineTo(-20,0); c.closePath(); c.stroke(); c.fill();
    c.fillStyle='#fff'; c.font='bold 9px monospace'; c.textAlign='center'; c.fillText('TP',0,3);
  } else if(/Elevation/.test(t)){
    c.strokeStyle='rgba(255,255,255,.5)'; c.lineWidth=1; c.setLineDash([3,3]);
    c.beginPath(); c.moveTo(0,0); c.lineTo(40,0); c.stroke(); c.setLineDash([]);
    c.fillStyle='#FFD60A'; c.font='bold 10px monospace'; c.fillText(o.text||'EL+0',20,-4);
  } else if(/Text/.test(t)){
    c.fillStyle=o.color||'#fff'; c.font='bold 12px monospace'; c.fillText(o.text||'Text',0,0);
  }
  c.restore();
}
function genSketchBOM(){
  const pipes=PROJECT.sketch.objs.filter(o=>o.type==='Pipe');
  const bySize={};
  pipes.forEach(p=>{bySize[p.size]=(bySize[p.size]||0)+p.length;});
  const syms={};
  PROJECT.sketch.objs.filter(o=>o.type!=='Pipe').forEach(o=>{
    const k=(o.size?o.size+'\"':'')+' '+o.type; syms[k]=(syms[k]||0)+1;
  });
  let txt='=== VDC SKETCH BOM ===\n\nLINEAR FEET:\n';
  Object.entries(bySize).forEach(([s,ft])=>txt+=`  NPS ${s}\"  ${toArch(ft)} (${ft.toFixed(2)} ft)\n`);
  txt+='\nCOMPONENTS:\n';
  Object.entries(syms).forEach(([k,n])=>txt+=`  ${k.padEnd(36)} ${n} EA\n`);
  const el=document.getElementById('sketchBOMPre'); if(el) el.textContent=txt;
  toast('Sketch BOM generated — see right panel');
}

function renderBOM(){
  const pipeMap={}, fitMap={}, hangMap={};
  PROJECT.spools.forEach(s=>{
    const sch=s.Schedule,conn=s.Connection,nps=s.NPS;
    const bom=Array.isArray(s.bom)&&s.bom.length?s.bom:null;
    if(bom){
      bom.forEach(item=>{
        const sz=String(item.size||nps).replace(/"/g,'').trim();
        const q=parseFloat(item.qty)||0; if(!q) return;
        if(/Bare Pipe/i.test(item.type)){const k=`${sz}" ${sch} Bare Pipe`;pipeMap[k]=(pipeMap[k]||0)+q;}
        else{const k=`${sz}" ${sch} ${conn} ${item.type}`;fitMap[k]=(fitMap[k]||0)+q;}
      });
    } else {
      const lf=parseFloat(s.LF)||0, fq=parseFloat(s['Qty Fit'])||0;
      if(lf){const k=`${nps}" ${sch} Bare Pipe`;pipeMap[k]=(pipeMap[k]||0)+lf;}
      if(fq){const k=`${nps}" ${sch} ${conn} Misc Fitting`;fitMap[k]=(fitMap[k]||0)+fq;}
    }
    const hq=parseFloat(s['Qty Hang'])||0, ht=s['Hang Type'];
    if(hq&&ht&&ht!=='None'){const k=`${nps}" ${ht}`;hangMap[k]=(hangMap[k]||0)+hq;}
  });
  // Also add from sketch BOM
  PROJECT.sketch.objs.filter(o=>o.type==='Pipe').forEach(o=>{
    const k=`${o.size||'2'}" SKETCH Bare Pipe`;pipeMap[k]=(pipeMap[k]||0)+(o.length||0);
  });
  let txt='═══════════════════════════════════════════════════════════\n';
  txt+='               MASTER PROCUREMENT BOM\n';
  txt+='═══════════════════════════════════════════════════════════\n\n';
  txt+='── RAW PIPE ─────────────────────────────────────────────\n';
  Object.entries(pipeMap).sort().forEach(([k,v])=>txt+=`  ${k.padEnd(50)} ${v.toFixed(1).padStart(8)} LF\n`);
  const totalLF=Object.values(pipeMap).reduce((a,b)=>a+b,0);
  txt+=`${'  TOTAL'.padEnd(52)} ${totalLF.toFixed(1).padStart(8)} LF\n\n`;
  txt+='── FITTINGS & FLANGES ──────────────────────────────────\n';
  Object.entries(fitMap).sort().forEach(([k,v])=>txt+=`  ${k.padEnd(50)} ${Math.round(v).toString().padStart(8)} EA\n`);
  txt+='\n── PIPE SUPPORTS & HANGERS ─────────────────────────────\n';
  Object.entries(hangMap).sort().forEach(([k,v])=>txt+=`  ${k.padEnd(50)} ${Math.round(v).toString().padStart(8)} EA\n`);
  txt+='\n── SUMMARY QUANTITIES ──────────────────────────────────\n';
  const R=rollUp();
  txt+=`  Total LF:             ${R.totalLF.toFixed(1).padStart(12)}\n`;
  txt+=`  Est. Total Weight:    ${R.totalWt.toFixed(0).padStart(12)} lbs\n`;
  txt+=`  Hydro Volume:         ${R.totalHydro.toFixed(0).padStart(12)} gal\n`;
  txt+=`  Paint Surface:        ${R.totalPaint.toFixed(0).padStart(12)} SF\n`;
  txt+=`  Total Weld Joints:    ${R.totalJoins.toFixed(0).padStart(12)}\n`;
  txt+=`  NDT Joints (${PROJECT.rates.ndtPct||10}%):  ${R.ndtCount.toString().padStart(12)}\n`;
  txt+=`  Total DI:             ${R.totalDI.toFixed(1).padStart(12)}\n`;
  const el=document.getElementById('bomOutput'); if(el) el.textContent=txt;
}

function redrawDash(){
  try{
    const R=rollUp();
    const eff=(R.eff*100).toFixed(1);
    document.getElementById('kQuote').textContent=fmt$(R.total);
    document.getElementById('kMH').textContent=fmt1(R.adjMH);
    document.getElementById('kCPM').textContent=fmt$(R.costPerMH);
    document.getElementById('kDI').textContent=fmt1(R.totalDI);
    document.getElementById('kSched').textContent=R.maxDay+'d';
    document.getElementById('kPeak').textContent=R.peakMP;
    document.getElementById('kEff').textContent=eff+'%';
    document.getElementById('kEff').style.color=R.eff>=.75?'var(--green)':R.eff>=.6?'var(--yellow)':'var(--red)';
    // Efficiency summary on project tab
    const es=document.getElementById('effSummary');
    if(es) es.textContent='Overall Efficiency: '+eff+'%  (Adj Factor: '+R.eff.toFixed(3)+')';
  }catch(e){}
}
function redraw(){ saveCurrent(); redrawDash(); }

/* =========================================================================
 *  SECTION 8 — SAVE / LOAD / EXPORT
 * ===================================================================== */
document.getElementById('btnSave').onclick=()=>{
  const name=PROJECT.meta.name||'Untitled';
  const map=listSaved(); map[PROJECT.id]=clone(PROJECT);
  persistSaved(map); saveCurrent(); toast('Saved: '+name);
};
document.getElementById('btnLoad').onclick=()=>{
  const map=listSaved(); const keys=Object.keys(map);
  if(!keys.length){toast('No saved projects',true);return;}
  const body=h('div');
  keys.forEach(k=>{
    const p=map[k];
    const btn=h('button',{class:'btn',style:'display:block;width:100%;margin-bottom:8px;text-align:left',onclick:()=>{
      PROJECT=clone(p); saveCurrent(); rebuild(); closeModal(); toast('Loaded: '+PROJECT.meta.name);
    }},`${p.meta?.name||'Untitled'} — Rev ${p.meta?.revision||'A'} — ${Object.keys(p.spools||{}).length||0} spools`);
    body.appendChild(btn);
  });
  openModal('Load Project',body,null);
};
document.getElementById('btnNew').onclick=()=>{
  if(!confirm('Start new project? Unsaved changes will be lost.')) return;
  PROJECT=emptyProject(); saveCurrent(); rebuild(); toast('New project created');
};
document.getElementById('btnExportJSON').onclick=()=>{
  const json=JSON.stringify(PROJECT,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=h('a',{href:url,download:(PROJECT.meta.name||'estimate').replace(/\s+/g,'_')+'.json'});
  a.click(); URL.revokeObjectURL(url); toast('Exported JSON');
};
document.getElementById('btnImportJSON').onclick=()=>document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      PROJECT=JSON.parse(ev.target.result);
      if(!PROJECT.spools) PROJECT.spools=[];
      if(!PROJECT.specs) PROJECT.specs=[];
      if(!PROJECT.cons) PROJECT.cons=[];
      if(!PROJECT.equips) PROJECT.equips=[];
      if(!PROJECT.subs) PROJECT.subs=[];
      if(!PROJECT.tasks) PROJECT.tasks=[];
      if(!PROJECT.sketch) PROJECT.sketch={objs:[],nextId:0};
      if(!PROJECT.meta) PROJECT.meta={};
      if(!PROJECT.rates) PROJECT.rates={};
      if(!PROJECT.efficiency) PROJECT.efficiency={economy:85,supervision:90,labor:80,conditions:75,weather:80,equipment:85};
      saveCurrent(); rebuild(); toast('Project imported: '+(PROJECT.meta.name||'Untitled'));
    }catch(ex){toast('Import failed — invalid file',true);}
  };
  reader.readAsText(file);
  e.target.value='';
};

/* =========================================================================
 *  SECTION 9 — CSV EXPORT HELPERS
 * ===================================================================== */
function exportCSV(type){
  let csv='', fn='export.csv';
  if(type==='takeoff'){
    fn=(PROJECT.meta.name||'estimate').replace(/\s+/g,'_')+'_takeoff.csv';
    csv='Tag,NPS,Schedule,Connection,Material,LF,Qty Fit,Qty Join,Weld Type,Hang Qty,Hang Type,Total MH,DI,Joints,Weight(lbs)\n';
    PROJECT.spools.forEach(s=>{const r=calcSpool(s);csv+=`"${s.Tag}","${s.NPS}","${s.Schedule}","${s.Connection}","${s.Material||'CS'}",${parseFloat(s.LF)||0},${parseFloat(s['Qty Fit'])||0},${parseFloat(s['Qty Join'])||0},"${s['Weld Type']}",${parseFloat(s['Qty Hang'])||0},"${s['Hang Type']}",${r.total.toFixed(2)},${r.di.toFixed(2)},${r.joinCnt.toFixed(0)},${r.wtLbs.toFixed(0)}\n`;});
  } else if(type==='bom'){
    fn=(PROJECT.meta.name||'estimate').replace(/\s+/g,'_')+'_bom.csv';
    csv='Description,Qty,Unit\n';
    const pipeMap={},fitMap={},hangMap={};
    PROJECT.spools.forEach(s=>{
      const bom=Array.isArray(s.bom)&&s.bom.length?s.bom:null;
      const nps=s.NPS,sch=s.Schedule,conn=s.Connection;
      if(bom){bom.forEach(item=>{const sz=String(item.size||nps).replace(/"/g,'').trim(),q=parseFloat(item.qty)||0;if(!q)return;if(/Bare Pipe/i.test(item.type)){const k=`${sz}" ${sch} Bare Pipe`;pipeMap[k]=(pipeMap[k]||0)+q;}else{const k=`${sz}" ${sch} ${conn} ${item.type}`;fitMap[k]=(fitMap[k]||0)+q;}});}
      else{const lf=parseFloat(s.LF)||0,fq=parseFloat(s['Qty Fit'])||0;if(lf){const k=`${nps}" ${sch} Bare Pipe`;pipeMap[k]=(pipeMap[k]||0)+lf;}if(fq){const k=`${nps}" ${sch} ${conn} Misc`;fitMap[k]=(fitMap[k]||0)+fq;}}
      const hq=parseFloat(s['Qty Hang'])||0,ht=s['Hang Type'];if(hq&&ht&&ht!=='None'){const k=`${nps}" ${ht}`;hangMap[k]=(hangMap[k]||0)+hq;}
    });
    Object.entries(pipeMap).sort().forEach(([k,v])=>csv+=`"${k}",${v.toFixed(1)},LF\n`);
    Object.entries(fitMap).sort().forEach(([k,v])=>csv+=`"${k}",${Math.round(v)},EA\n`);
    Object.entries(hangMap).sort().forEach(([k,v])=>csv+=`"${k}",${Math.round(v)},EA\n`);
  } else if(type==='finance'){
    fn=(PROJECT.meta.name||'estimate').replace(/\s+/g,'_')+'_financials.csv';
    const R=rollUp();
    csv='Item,Value\n';
    csv+=`"Total Bid",${R.total.toFixed(2)}\n"Adj Man-Hours",${R.adjMH.toFixed(2)}\n"Labor Cost",${R.laborCost.toFixed(2)}\n"Per Diem",${R.perDiemCost.toFixed(2)}\n"Equipment",${R.equipCost.toFixed(2)}\n"Consumables",${R.consCost.toFixed(2)}\n"Subcontractors",${R.subCost.toFixed(2)}\n"NDT Cost",${R.ndtCost.toFixed(2)}\n"Sales Tax",${R.tax.toFixed(2)}\n"Overhead",${R.overhead.toFixed(2)}\n"Bond+Ins",${R.bond.toFixed(2)}\n"Profit",${(R.total-R.subtotal).toFixed(2)}\n`;
  } else if(type==='sched'){
    fn=(PROJECT.meta.name||'estimate').replace(/\s+/g,'_')+'_schedule.csv';
    csv='Task,Est MH,Crew,Shift Hrs,Start Day,Duration,% Complete,Status\n';
    PROJECT.tasks.forEach(t=>csv+=`"${t['Task Name']}",${t['Est MH']||0},${t['Crew Size']||1},${t['Shift Hrs']||10},${t['Start Day']||1},${t['Duration (Days)']||1},${t['% Complete']||0},"${t.Status||'Not Started'}"\n`);
  }
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=h('a',{href:url,download:fn}); a.click(); URL.revokeObjectURL(url);
  toast('CSV exported');
}

/* =========================================================================
 *  SECTION 10 — BOOT
 * ===================================================================== */
function rebuild(){
  buildTabs();
  buildPanes();
  redraw();
}
function init(){
  buildTabs();
  buildPanes();
  redrawDash();
  // Nav click rebuilding
  $$('#tabNav button').forEach((b,i)=>{
    b.addEventListener('click',()=>{ switchTab(TABS[i].id); buildTabs(); });
  });
}
window.addEventListener('resize', ()=>{ if(CANVAS) resizeSketchCanvas(); });
window.addEventListener('load', init);

/* Register PWA service worker for offline caching */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
}
